# sonar.projectKey e sonar.organization são definidos pela pipeline
# (passo "Definir projeto do Sonar" em .github/workflows/devsecops.yml)
sonar.projectName=Destinos do Brasil
sonar.projectVersion=1.0

sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# app.js só manipula o DOM (navegador); a cobertura é medida na lógica (filtros.js)
sonar.coverage.exclusions=src/app.js

# destinos.js e fotos.js são só DADOS (lista de objetos com o mesmo formato).
# O detector de duplicação ignora os textos e vê os blocos como "código copiado",
# então eles ficam fora da checagem de duplicação. Bugs, code smells e
# vulnerabilidades continuam sendo analisados normalmente nesses arquivos.
sonar.cpd.exclusions=src/destinos.js,src/fotos.js
