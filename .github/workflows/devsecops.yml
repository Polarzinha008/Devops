name: DevSecOps Pipeline

# Fluxo:
#   quality (Sonar) ──────┐
#   security-iac (Trivy) ─┼──→ build (Docker + Trivy image + push Docker Hub) ──→ deploy (kind)
#   security-code (Trivy)─┘

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

env:
  IMAGE_NAME: destinos-do-brasil

jobs:
  # 1) Qualidade de código: testes + cobertura + SonarQube com Quality Gate
  quality:
    name: quality (SonarQube)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # necessário para o Sonar calcular o "new code"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Testes com cobertura
        run: npm run test:coverage

      # Descobre a organização e a chave do projeto a partir do repositório,
      # para funcionar em qualquer fork sem editar arquivos.
      # Padrão do SonarCloud ao importar do GitHub:
      #   organização = dono do repo (minúsculo); chave = dono_repo
      # Para usar outros valores, crie as variáveis SONAR_ORGANIZATION e/ou
      # SONAR_PROJECT_KEY em Settings → Secrets and variables → Actions → Variables.
      - name: Definir projeto do Sonar
        id: sonar
        env:
          HOST: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}
          ORG: ${{ vars.SONAR_ORGANIZATION }}
          KEY: ${{ vars.SONAR_PROJECT_KEY }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          KEY="${KEY:-${OWNER}_${REPO}}"
          ARGS="-Dsonar.projectKey=${KEY}"
          if [[ "$HOST" == *sonarcloud.io* || "$HOST" == *sonarqube.cloud* ]]; then
            ORG="${ORG:-${OWNER,,}}"
            ARGS="$ARGS -Dsonar.organization=${ORG}"
            echo "SonarQube Cloud → organização: ${ORG}"
          fi
          echo "Chave do projeto: ${KEY}"
          echo "args=${ARGS}" >> "$GITHUB_OUTPUT"

      - name: SonarQube Scan + Quality Gate
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        with:
          # qualitygate.wait faz o job FALHAR se o Quality Gate não passar
          args: >
            ${{ steps.sonar.outputs.args }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  # 2) Segurança de IaC: Dockerfile e manifestos Kubernetes
  security-iac:
    name: security-iac (Trivy config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Trivy IaC (gate HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          format: table
          exit-code: "1"

      - name: Trivy IaC (relatório SARIF)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          skip-setup-trivy: true
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-iac-results.sarif

      - name: Enviar SARIF para a aba Security
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-iac-results.sarif
          category: trivy-iac

      - name: Salvar relatório
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-trivy-iac
          path: trivy-iac-results.sarif

  # 3) Segurança do código: secrets expostos e dependências vulneráveis
  security-code:
    name: security-code (Trivy fs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Trivy fs - secrets e vulnerabilidades (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          format: table
          exit-code: "1"

  # 4) Build da imagem, scan da imagem com Trivy e push para o Docker Hub
  build:
    name: build (Docker + Trivy image + push)
    runs-on: ubuntu-latest
    needs: [quality, security-iac, security-code]
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - name: Definir nome da imagem
        id: meta
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME }}
        # Nomes de imagem no Docker Hub precisam ser minúsculos
        run: echo "image=${DOCKER_USER,,}/${IMAGE_NAME}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build da imagem Docker
        run: docker build -t "${{ steps.meta.outputs.image }}" .

      - name: Trivy scan da imagem (gate HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: ${{ steps.meta.outputs.image }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

      - name: Trivy scan da imagem (relatório SARIF)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          skip-setup-trivy: true
          image-ref: ${{ steps.meta.outputs.image }}
          format: sarif
          output: trivy-image-results.sarif

      - name: Enviar SARIF para a aba Security
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image

      - name: Salvar relatório
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-trivy-imagem
          path: trivy-image-results.sarif

      - name: Login no Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_PASSWORD }}

      - name: Push da imagem para o Docker Hub
        if: github.event_name != 'pull_request'
        run: |
          IMAGE="${{ steps.meta.outputs.image }}"
          LATEST="${IMAGE%:*}:latest"
          docker tag "$IMAGE" "$LATEST"
          docker push "$IMAGE"
          docker push "$LATEST"

  # 5) Deploy no cluster kind usando a imagem publicada no Docker Hub
  deploy:
    name: deploy (kind)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - name: Criar cluster kind
        uses: helm/kind-action@v1
        with:
          cluster_name: turismo
          config: kind-config.yaml

      - name: Aplicar manifestos com a imagem do Docker Hub
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          kubectl apply -f k8s/namespace.yaml
          sed -E "s#image: .*destinos-do-brasil:.*#image: docker.io/${IMAGE}#" k8s/deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/service.yaml

      - name: Aguardar o rollout
        run: kubectl -n turismo rollout status deployment/destinos-frontend --timeout=180s

      - name: Verificar o frontend no ar
        run: |
          kubectl -n turismo get pods,svc -o wide
          kubectl -n turismo get deployment destinos-frontend -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'
          # A porta 30080 do nó kind está mapeada para localhost:8080 (kind-config.yaml)
          for i in $(seq 1 10); do
            curl -fsS http://localhost:8080/healthz && break
            sleep 3
          done
          curl -fsS http://localhost:8080/ | grep -o '<title>.*</title>'
          curl -fsS http://localhost:8080/ -o pagina.html

      - name: Salvar página servida pelo cluster
        uses: actions/upload-artifact@v7
        with:
          name: frontend-no-kind
          path: pagina.html
