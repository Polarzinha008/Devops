# Cluster kind com a porta 30080 do nó exposta em localhost:8080.
# Uso local: kind create cluster --name turismo --config kind-config.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
